        .touch-button {

            background: rgba(196, 196, 196, 0.8);

            left: 57%;

        .touch-button:hover {

        }

        .close-btn2 {

        /* ===== Bottom Center Jumpbar ===== */
        :root {
            --chip-bg: #2b2b2b;
            /* pill bg */
            --chip-fg: #fff;
            /* pill text */
            --chip-fg-dim: #cfcfcf;
            --chip-bg-hover: #3a3a3a;
            /* hover bg */
            --chip-ring: rgba(255, 255, 255, .12);
            --bar-bg: rgba(0, 0, 0, .35);
            /* translucent bar behind chips */
            --bar-blur: 10px;
            /* subtle blur on supported browsers */
            --gap: 10px;
            --radius: 10px;
            --chip-pad-y: 8px;
            --chip-pad-x: 14px;
            --chip-fs: 12px;
        }

        /* fixed & centered relative to the viewport */
        .jumpbar {
            position: fixed;
            left: 50%;
            bottom: max(16px, env(safe-area-inset-bottom, 16px));
            transform: translateX(-50%);
            z-index: 9990;
            width: fit-content;
            max-width: 96vw;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);

            /* NEW 👇 */
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            /* hide scrollbar Firefox */
        }

        .jumpbar::-webkit-scrollbar {
            display: none;
            /* hide scrollbar Chrome/Safari */
        }

        .jumpbar-inner {
            display: inline-flex;
            /* inline-flex keeps them in one line */
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            white-space: nowrap;
        }

        /* Pills */
        .jumpchip {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #2b2b2b;
            color: #fff;
            font: 600 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s ease, transform 0.08s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .jumpchip:hover {
            background: #3a3a3a;
        }

        .jumpchip:active {
            transform: translateY(1px);
        }

        .jumpchip.is-accent {
            background: #c49a6c;
            /* bronze */
            border-color: rgba(196, 154, 108, 0.5);
            color: #1b1b1b;
        }

        .jumpchip.is-accent:hover {
            background: #d8a86e;
            /* polished amber hover */
        }


        /* optional: bronze accent variant to match your theme */
        .jumpchip.is-accent {
            background: #c49a6c;
            /* bronze */
            border-color: rgba(196, 154, 108, .5);
            color: #1b1b1b;
        }

        .jumpchip.is-accent:hover {
            background: #d8a86e;
            /* polished amber on hover */
        }

        /* quick, soft placeholder look */
        .blur-up {
            filter: blur(10px);
            transform: scale(1.02);
            transition: filter .45s ease, transform .45s ease, opacity .35s ease;
        }

        /* once the full image is in */
        .blur-up.is-loaded {
            filter: blur(0);
            transform: scale(1);
            opacity: 1;
        }

        /* ===== SVG HOTSPOT OVERLAY ===== */
        .sco-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .sco-overlay .st0 {
            fill: rgba(196, 154, 108, .16);
            stroke: rgba(255, 255, 255, .45);
            stroke-miterlimit: 10;
            stroke-width: 6px;
            opacity: 1;
            cursor: pointer;
            pointer-events: auto;
            transition: fill .25s ease, stroke .25s ease;
        }

        .sco-overlay .st0:hover,
        .sco-overlay .st0.is-active {
            fill: rgba(196, 154, 108, .45);
            stroke: #fff;
        }

        .sco-tip {
            position: fixed;
            z-index: 9995;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #fff;
            font: 600 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -140%);
            transition: opacity .18s ease;
        }

        .sco-tip.is-visible {
            opacity: 1;
        }
    </style>

        <!-- ===== SVG HOTSPOT HOVER + CLICK ===== -->
        <script>
            (function () {
                const overlay = document.querySelector('.sco-overlay');
                const tip = document.getElementById('scoTip');

                if (!overlay || !tip) return;

                const shapes = overlay.querySelectorAll('path[data-link]');

                shapes.forEach(shape => {
                    const name = shape.dataset.name || shape.id.replace(/_/g, ' ');
                    const link = shape.dataset.link;

                    shape.addEventListener('mouseenter', () => {
                        tip.textContent = name;
                        tip.classList.add('is-visible');
                    });

                    shape.addEventListener('mousemove', e => {
                        tip.style.left = e.clientX + 'px';
                        tip.style.top = e.clientY + 'px';
                    });

                    shape.addEventListener('mouseleave', () => {
                        tip.classList.remove('is-visible');
                    });

                    shape.addEventListener('click', () => {
                        if (link) window.location.href = link;
                    });

                    // Mobile: first tap highlights, second tap navigates.
                    let armed = false;

                    shape.addEventListener('touchstart', e => {
                        if (!armed) {
                            e.preventDefault();

                            shapes.forEach(s => s.classList.remove('is-active'));
                            shape.classList.add('is-active');

                            tip.textContent = name;
                            tip.style.left = e.touches[0].clientX + 'px';
                            tip.style.top = e.touches[0].clientY + 'px';
                            tip.classList.add('is-visible');

                            armed = true;

                            setTimeout(() => {
                                armed = false;
                                shape.classList.remove('is-active');
                                tip.classList.remove('is-visible');
                            }, 2500);
                        } else {
                            if (link) window.location.href = link;
                        }
                    }, { passive: false });
                });
            })();
        </script>
